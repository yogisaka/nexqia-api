name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nexqia-api:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/nexqia-api:latest

  deploy-prod:
    needs: build-and-push
    runs-on: [self-hosted, production-server]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yml pull
      - run: docker compose -f deploy/docker-compose.yml up -d
