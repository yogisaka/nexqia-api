name: CI

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [master, develop]
    paths-ignore: ['**.md', 'docs/**']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          only-new-issues: true
      - name: Unit tests
        run: make test
      - name: Integration tests
        run: make test-integration

  build-and-push-dev:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: VERSION=develop-${{ github.sha }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nexqia-api:develop,ghcr.io/${{ github.repository_owner }}/nexqia-api:develop-${{ github.sha }}

  deploy-dev:
    needs: build-and-push-dev
    runs-on: [self-hosted, develop-server]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yml pull
      - run: docker compose -f deploy/docker-compose.yml up -d
