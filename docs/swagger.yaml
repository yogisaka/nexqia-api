  /audit/patients:
    get:
      description: |-
        Finds patients of the caller's company by full-name substring
        or exact medical-record number. Soft-deleted patients stay
        searchable (flagged deleted) so old log rows stay readable.
        Max 20 rows. Wildcards in q are matched literally.
      parameters:
      - description: Full-name substring or exact medical_record_no (2-100 characters)
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.apiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/server.apiResponse'
      security:
      - BearerAuth: []
      summary: Search patients for the audit-log person filter
      tags:
      - audit
  /audit/review/summary:
    get:
      description: |-
        Aggregates access_log/audit_log activity per user for the
        caller's company over the given window and computes review
        flags: after_hours (access outside the configured working
        hours), denied (>= AUDIT_REVIEW_DENIED_THRESHOLD 403s),
        self_family (access involving the actor's own/family person),
        volume (views above the configured multiplier × the period
        median) and platform_admin. Rows are ordered by flag count,
        then views, then actor_id.
      parameters:
      - description: 'Range start, RFC3339 (default: to − 7 days)'
        in: query
        name: from
        type: string
      - description: 'Range end, RFC3339 (default: now)'
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.apiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/server.apiResponse'
      security:
      - BearerAuth: []
      summary: Summarize per-user access with review flags
      tags:
      - audit
  /audit/reviews:
    get:
      description: Returns the caller's company review records, newest first.
      parameters:
      - description: Page size (default 50, max 200)
        in: query
        name: limit
