basePath: /api/v1
definitions:
  server.addRolePermissionRequest:
    properties:
      permission_id:
        type: string
    required:
    - permission_id
    type: object
  server.addUserMerchantRoleRequest:
    properties:
      merchant_id:
        type: string
      role_id:
        type: string
    required:
    - merchant_id
    - role_id
    type: object
  server.apiErrorResponse:
    properties:
      error:
        type: string
    type: object
  server.apiResponse:
    properties:
      data: {}
      meta: {}
    type: object
  server.changePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  server.createAdmissionRequest:
    properties:
      companion_name:
        type: string
      complaint:
        type: string
      department_id:
        type: string
      diagnosis_text:
        type: string
      guarantor_name:
        type: string
      needs_companion:
        type: boolean
      note:
        type: string
      person_id:
        type: string
      physician_id:
        type: string
      policy_number:
        type: string
      primary_payer_id:
        type: string
      referral_origin:
        type: string
      referral_source:
        type: string
      special_patient_type:
        type: string
      treatment_barriers:
        type: string
    required:
    - department_id
    - person_id
    type: object
  server.createAppUserRequest:
    properties:
      company_id:
        type: string
      email:
        type: string
      password:
        minLength: 8
        type: string
      person_id:
        type: string
      username:
        type: string
    required:
    - company_id
    - password
    - person_id
    - username
    type: object
  server.createCounterRequest:
    properties:
      code:
        type: string
      department_id:
        type: string
      merchant_id:
        type: string
      name:
        type: string
      queue_type:
        type: string
    required:
    - code
    - merchant_id
    - queue_type
    type: object
  server.createDepartmentRequest:
    properties:
      code:
        type: string
      merchant_id:
        type: string
      name:
        type: string
      specialty_concept_id:
        type: string
    required:
    - code
    - merchant_id
    - name
    type: object
  server.createMerchantRequest:
    properties:
      bpjs_ppk_code:
        type: string
      company_id:
        type: string
      kemkes_facility_code:
        type: string
      name:
        type: string
      timezone:
        type: string
    required:
    - company_id
    - name
    - timezone
    type: object
  server.createPhysicianRequest:
    properties:
      merchant_id:
        type: string
      person_id:
        type: string
      sip_number:
        type: string
      specialty_concept_id:
        type: string
      str_number:
        type: string
    required:
    - merchant_id
    - person_id
    type: object
  server.createPhysicianScheduleRequest:
    properties:
      day_of_week:
        maximum: 6
        minimum: 0
        type: integer
      department_id:
        type: string
      effective_from:
        type: string
      effective_to:
        type: string
      end_time:
        type: string
      merchant_id:
        type: string
      physician_id:
        type: string
      slot_quota:
        type: integer
      start_time:
        type: string
    required:
    - department_id
    - effective_from
    - end_time
    - merchant_id
    - physician_id
    - start_time
    type: object
  server.createPlatformAdminUserRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 8
        type: string
      role_id:
        type: string
      username:
        type: string
    required:
    - email
    - full_name
    - password
    - role_id
    - username
    type: object
  server.createPlatformCompanyRequest:
    properties:
      company_name:
        minLength: 3
        type: string
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
      username:
        type: string
    required:
    - company_name
    - email
    - full_name
    - password
    - phone
    - username
    type: object
  server.createRateComponentRequest:
    properties:
      code:
        type: string
      merchant_id:
        type: string
      name:
        type: string
    required:
    - code
    - merchant_id
    - name
    type: object
  server.createRoleRequest:
    properties:
      company_id:
        type: string
      description:
        type: string
      name:
        type: string
      requires_physician_data:
        type: boolean
    required:
    - company_id
    - name
    type: object
  server.createServiceItemRequest:
    properties:
      code:
        type: string
      item_type:
        type: string
      merchant_id:
        type: string
      name:
        type: string
    required:
    - code
    - item_type
    - merchant_id
    - name
    type: object
  server.createServiceRateRequest:
    properties:
      amount:
        type: string
      effective_from:
        type: string
      effective_to:
        type: string
      merchant_id:
        type: string
      payer_class:
        type: string
      rate_component_id:
        type: string
      service_item_id:
        type: string
    required:
    - amount
    - effective_from
    - merchant_id
    - payer_class
    - rate_component_id
    - service_item_id
    type: object
  server.diagnosisConfigRequest:
    properties:
      code_system:
        type: string
    required:
    - code_system
    type: object
  server.impersonateRequest:
    properties:
      company_id:
        type: string
      reason:
        minLength: 10
        type: string
      username:
        type: string
    required:
    - company_id
    - reason
    - username
    type: object
  server.loginRequest:
    properties:
      password:
        type: string
      totp_code:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  server.mfaConfirmRequest:
    properties:
      code:
        type: string
      password:
        type: string
      secret:
        type: string
    required:
    - code
    - password
    - secret
    type: object
  server.mfaDisableRequest:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  server.mfaEnrollRequest:
    properties:
      code:
        type: string
      enrollment_token:
        type: string
      secret:
        type: string
    required:
    - code
    - enrollment_token
    - secret
    type: object
  server.mrnConfigRequest:
    properties:
      format:
        type: string
    required:
    - format
    type: object
  server.patientAllergyRequest:
    properties:
      allergy_type:
        type: string
      effect_side:
        type: string
      event_date:
        type: string
      reaction:
        type: string
      severity:
        type: string
      substance_name:
        type: string
    required:
    - allergy_type
    - substance_name
    type: object
  server.personFamilyRequest:
    properties:
      address:
        type: string
      birth_date:
        type: string
      birth_place:
        type: string
      email:
        type: string
      full_name:
        type: string
      gender:
        type: string
      is_responsible_person:
        type: boolean
      job_concept_id:
        type: string
      phone:
        type: string
      position_concept_id:
        type: string
      postal_code:
        type: string
      region_village_concept_id:
        type: string
      relationship_concept_id:
        type: string
    required:
    - full_name
    type: object
  server.personRequest:
    properties:
      address:
        type: string
      birth_date:
        type: string
      birth_place:
        type: string
      blood_type:
        type: string
      blood_type_concept_id:
        type: string
      citizenship_concept_id:
        type: string
      education_concept_id:
        type: string
      email:
        type: string
      ethnicity_concept_id:
        type: string
      family_id:
        type: string
      full_name:
        type: string
      gender:
        type: string
      identity_type_concept_id:
        type: string
      job_concept_id:
        type: string
      marital_status:
        type: string
      marital_status_concept_id:
        type: string
      medical_record_no:
        type: string
      nik:
        type: string
      phone:
        type: string
      region_village_concept_id:
        type: string
      religion_concept_id:
        type: string
    required:
    - full_name
    - gender
    type: object
  server.pinDisableRequest:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  server.pinSetRequest:
    properties:
      password:
        type: string
      pin:
        type: string
    required:
    - password
    - pin
    type: object
  server.pinVerifyRequest:
    properties:
      pin:
        type: string
    required:
    - pin
    type: object
  server.platformAdminLoginRequest:
    properties:
      password:
        type: string
      totp_code:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  server.platformMFAConfirmRequest:
    properties:
      code:
        type: string
      password:
        type: string
      secret:
        type: string
    required:
    - code
    - password
    - secret
    type: object
  server.platformMFAEnrollRequest:
    properties:
      code:
        type: string
      enrollment_token:
        type: string
      secret:
        type: string
    required:
    - code
    - enrollment_token
    - secret
    type: object
  server.registerRequest:
    properties:
      company_name:
        minLength: 3
        type: string
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 8
        type: string
      password_confirmation:
        type: string
      phone:
        type: string
      username:
        type: string
    required:
    - company_name
    - email
    - full_name
    - password
    - password_confirmation
    - phone
    - username
    type: object
  server.securitySettingsRequest:
    properties:
      password:
        type: string
      pin_lock:
        properties:
          enabled:
            type: boolean
          idle_minutes:
            type: integer
        required:
        - enabled
        - idle_minutes
        type: object
      require_totp:
        type: boolean
    required:
    - password
    - pin_lock
    - require_totp
    type: object
  server.selectMerchantRequest:
    properties:
      merchant_id:
        type: string
      selection_token:
        type: string
    required:
    - merchant_id
    - selection_token
    type: object
  server.switchMerchantRequest:
    properties:
      merchant_id:
        type: string
    required:
    - merchant_id
    type: object
  server.updateAdmissionRequest:
    properties:
      discharge_at:
        type: string
      physician_id:
        type: string
      status:
        type: string
    required:
    - status
    type: object
  server.updateAppUserPasswordRequest:
    properties:
      password:
        minLength: 8
        type: string
    required:
    - password
    type: object
  server.updateAppUserRequest:
    properties:
      email:
        type: string
      is_active:
        type: boolean
      person_id:
        type: string
    required:
    - person_id
    type: object
  server.updateCompanyRequest:
    properties:
      is_active:
        type: boolean
      name:
        type: string
    required:
    - name
    type: object
  server.updateCounterRequest:
    properties:
      code:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    required:
    - code
    type: object
  server.updateDepartmentRequest:
    properties:
      is_active:
        type: boolean
      name:
        type: string
      specialty_concept_id:
        type: string
    required:
    - name
    type: object
  server.updateMeRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      phone:
        type: string
    type: object
  server.updateMerchantRequest:
    properties:
      bpjs_ppk_code:
        type: string
      is_active:
        type: boolean
      kemkes_facility_code:
        type: string
      name:
        type: string
      timezone:
        type: string
    required:
    - name
    - timezone
    type: object
  server.updatePatientAllergyRequest:
    properties:
      effect_side:
        type: string
      event_date:
        type: string
      reaction:
        type: string
      severity:
        type: string
    type: object
  server.updatePhysicianRequest:
    properties:
      is_active:
        type: boolean
      sip_number:
        type: string
      specialty_concept_id:
        type: string
      str_number:
        type: string
    type: object
  server.updatePhysicianScheduleRequest:
    properties:
      day_of_week:
        maximum: 6
        minimum: 0
        type: integer
      effective_from:
        type: string
      effective_to:
        type: string
      end_time:
        type: string
      is_active:
        type: boolean
      slot_quota:
        type: integer
      start_time:
        type: string
    required:
    - effective_from
    - end_time
    - start_time
    type: object
  server.updateQueueStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  server.updateRateComponentRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  server.updateRoleRequest:
    properties:
      description:
        type: string
      name:
        type: string
      requires_physician_data:
        type: boolean
    required:
    - name
    type: object
  server.updateServiceItemRequest:
    properties:
      is_active:
        type: boolean
      item_type:
        type: string
      name:
        type: string
    required:
    - item_type
    - name
    type: object
  server.updateServiceRateRequest:
    properties:
      amount:
        type: string
      effective_to:
        type: string
    required:
    - amount
    type: object
info:
  contact: {}
  description: 'Backend service for the NEXQIA Healthcare Operating Platform. All
    routes are under /api/v1. Response envelope: {"data": ..., "meta": {...}}.'
  title: NEXQIA API
  version: "1.0"
paths:
  /admissions:
    get:
      parameters:
      - description: Active merchant UUID
        in: header
        name: X-Merchant-ID
        required: true
        type: string
      - description: Department UUID
        in: query
        name: department_id
        required: true
        type: string
      - description: Admission status
        in: query
        name: status
        required: true
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiResponse'
      security:
      - BearerAuth: []
      summary: List admissions for a work queue
      tags:
      - admission
    post:
      consumes:
      - application/json
      description: Registers the kunjungan (admission, outpatient) and its first queue
        row (pendaftaran) atomically.
      parameters:
      - description: Active merchant UUID
        in: header
        name: X-Merchant-ID
        required: true
        type: string
      - description: Admission data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.createAdmissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.apiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/server.apiErrorResponse'
      security:
      - BearerAuth: []
      summary: Check in a patient (FO)
      tags:
      - admission
  /admissions/{id}:
    get:
      parameters:
      - description: Admission UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.apiErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an admission by id
      tags:
      - admission
    patch:
      consumes:
      - application/json
      description: Generic column writes (physician reassignment, status, discharge_at)
        — "discharge" as a business action belongs to a future CPPT/resume sub-project.
      parameters:
      - description: Admission UUID
        in: path
        name: id
        required: true
        type: string
      - description: Admission data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.updateAdmissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.apiErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an admission
      tags:
      - admission
  /admissions/payer-summary:
    get:
      parameters:
      - description: Active merchant UUID
        in: header
        name: X-Merchant-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiResponse'
      security:
      - BearerAuth: []
      summary: Today's admission count grouped by payer type (dashboard "Jenis Pasien"
        widget)
      tags:
      - admission
  /audit/access-logs:
    get:
      description: |-
        Returns core.access_log rows for the caller's company, newest
        first. Only rows the authenticated company owns are ever returned.
      parameters:
      - description: 'Range start, RFC3339 (default: to − 7 days)'
        in: query
        name: from
        type: string
      - description: 'Range end, RFC3339 (default: now)'
        in: query
        name: to
        type: string
      - description: Filter by actor UUID
        in: query
        name: actor_id
        type: string
      - description: Filter by patient UUID
        in: query
        name: person_id
        type: string
      - description: Filter by resource name (e.g. person)
        in: query
        name: resource
        type: string
      - description: Filter by resource UUID
        in: query
        name: resource_id
        type: string
      - description: Filter by action name (e.g. view)
        in: query
        name: action
        type: string
      - description: Page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.apiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/server.apiResponse'
      security:
      - BearerAuth: []
      summary: List access-log rows (who read which patient data)
      tags:
      - audit
  /audit/change-logs:
    get:
      description: |-
        Returns core.audit_log rows for the caller's company, newest
        first. Field names only — old/new values are never stored or returned.
      parameters:
      - description: 'Range start, RFC3339 (default: to − 7 days)'
        in: query
        name: from
        type: string
      - description: 'Range end, RFC3339 (default: now)'
        in: query
        name: to
        type: string
      - description: Filter by table name (e.g. core.person)
        in: query
        name: table_name
        type: string
      - description: Filter by record UUID
        in: query
        name: record_id
        type: string
      - description: Filter by patient UUID
        in: query
        name: person_id
        type: string
      - description: Filter by changed_by user UUID
        in: query
        name: changed_by
        type: string
      - description: Filter by action name (e.g. insert)
        in: query
        name: action
        type: string
      - description: Page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.apiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/server.apiResponse'
      security:
      - BearerAuth: []
      summary: List change-log rows (who changed which patient-data fields)
      tags:
      - audit
  /audit/patients:
    get:
      description: |-
        Finds patients of the caller's company by full-name substring
        or exact medical-record number. Soft-deleted patients stay
        searchable (flagged deleted) so old log rows stay readable.
        Max 20 rows. Wildcards in q are matched literally.
      parameters:
      - description: Full-name substring or exact medical_record_no (2-100 characters)
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.apiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/server.apiResponse'
      security:
      - BearerAuth: []
      summary: Search patients for the audit-log person filter
      tags:
      - audit
  /audit/users:
    get:
      description: |-
        Finds users of the caller's company by username or person
        full-name substring, including soft-deleted ones (flagged
        deleted). Max 20 rows. Wildcards in q are matched literally.
      parameters:
      - description: Username or full-name substring (2-100 characters)
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.apiResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/server.apiResponse'
      security:
      - BearerAuth: []
      summary: Search users for the audit-log actor filter
      tags:
      - audit
  /auth/login:
    post:
      consumes:
      - application/json
      description: Rate-limited by username/IP. Returns totp_required if the account
        has TOTP enabled and no/invalid code was given, or requires_merchant_selection
        if the user belongs to more than one merchant.
      parameters:
      - description: Company UUID
        in: header
        name: X-Company-ID
        required: true
        type: string
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.apiErrorResponse'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the session tied to the refresh_token cookie. Does not
        require a valid access token.
      parameters:
      - description: Company UUID
        in: header
        name: X-Company-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
