    post:
      consumes:
      - application/json
      description: |-
        Stores an append-only review record for the period. flagged_users
        is computed server-side from the same counts and flags as the
        summary endpoint; the caller only supplies the period and notes.
      parameters:
      - description: Review period (RFC3339) and notes (1-2000 chars)
        in: body
        name: body
        required: true
        schema:
